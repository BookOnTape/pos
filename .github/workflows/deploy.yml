name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# let a running deploy finish; queue at most one more
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pages must already be switched on for the repo (Settings -> Pages ->
      # Source: GitHub Actions). The `enablement: true` option can't do it
      # here — creating a Pages site needs a token with more rights than the
      # workflow's GITHUB_TOKEN has.
      - uses: actions/configure-pages@v5

      # the app is plain HTML/CSS/JS — no build step
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
